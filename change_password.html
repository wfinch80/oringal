<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }
        h1 { 
            color: #333; 
            margin-top: 0;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        h2 {
            color: #555;
            font-size: 20px;
            margin-top: 30px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        h2:first-of-type {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #5568d3;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }
        .message-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .back-link {
            text-align: center;
            margin-top: 30px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        .divider {
            height: 1px;
            background: #eee;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account Settings</h1>
        
        <h2>Change Username</h2>
        <div id="usernameMessage"></div>
        <form id="changeUsernameForm">
            <div class="form-group">
                <label for="new_username">New Username</label>
                <input type="text" id="new_username" name="new_username" required>
            </div>
            <div class="form-group">
                <label for="username_password">Confirm Your Password</label>
                <input type="password" id="username_password" name="password" required>
            </div>
            <button type="submit" class="btn">Change Username</button>
        </form>
        
        <div class="divider"></div>
        
        <h2>Change Password</h2>
        <div id="passwordMessage"></div>
        <form id="changePasswordForm">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn">Change Password</button>
        </form>
        
        <div class="back-link">
            <a href="/admin">Back to Dashboard</a>
        </div>
    </div>

    <script>
        document.getElementById('changeUsernameForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newUsername = document.getElementById('new_username').value;
            const password = document.getElementById('username_password').value;
            const msgDiv = document.getElementById('usernameMessage');
            
            try {
                const response = await fetch('/api/change_username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        new_username: newUsername,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgDiv.innerHTML = '<div class="message message-success">Username changed successfully!</div>';
                    document.getElementById('changeUsernameForm').reset();
                } else {
                    msgDiv.innerHTML = `<div class="message message-error">${data.error}</div>`;
                }
            } catch (error) {
                msgDiv.innerHTML = `<div class="message message-error">Error: ${error.message}</div>`;
            }
        });

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const currentPassword = document.getElementById('current_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const msgDiv = document.getElementById('passwordMessage');
            
            if (newPassword !== confirmPassword) {
                msgDiv.innerHTML = '<div class="message message-error">New passwords do not match</div>';
                return;
            }
            
            if (newPassword.length < 4) {
                msgDiv.innerHTML = '<div class="message message-error">New password must be at least 4 characters</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/change_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    msgDiv.innerHTML = '<div class="message message-success">Password changed successfully!</div>';
                    document.getElementById('changePasswordForm').reset();
                } else {
                    msgDiv.innerHTML = `<div class="message message-error">${data.error}</div>`;
                }
            } catch (error) {
                msgDiv.innerHTML = `<div class="message message-error">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
